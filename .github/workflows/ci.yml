name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: PHP ${{ matrix.php }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every supported PHP version on Linux, plus the ends of the range on
      # macOS. The README has always claimed macOS, and the extension links
      # differently there (see .cargo/config.toml), so it needs to be built
      # and tested somewhere rather than assumed.
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        # ubuntu-24.04, not ubuntu-latest: the latest label migrated to
        # Ubuntu 26, whose default clang is llvm-21, and bindgen cannot parse
        # llvm-21's x86 SSE intrinsics headers against the PHP headers
        # ("Unable to generate bindings for PHP"). A build that reads the
        # system clang should name its image anyway rather than follow a
        # moving label.
        os: [ubuntu-24.04, macos-15]
        exclude:
          - { os: macos-15, php: "8.2" }
          - { os: macos-15, php: "8.3" }
          - { os: macos-15, php: "8.4" }
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP ${{ matrix.php }} (with php-config / dev headers)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          tools: composer:v2

      # No libclang install step here on purpose. The runner images already
      # ship a working libclang, and `apt-get install libclang-dev` pulls an
      # llvm whose x86 SSE intrinsics headers (xmmintrin.h, emmintrin.h)
      # bindgen cannot parse against the PHP headers, failing every Linux job
      # with "Unable to generate bindings for PHP".

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: php-${{ matrix.php }}-${{ matrix.os }}

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build extension
        run: cargo build --release

      - name: composer install
        # ext-sorocharge is the extension this repo builds; it can't be
        # installed before the build, so skip only that platform check.
        run: composer install --no-interaction --no-progress --ignore-platform-req=ext-sorocharge

      - name: phpstan (level max, on the shipped package surface)
        run: composer stan

      - name: composer test (builds with test hooks, runs PHPUnit against it)
        run: composer test

  malware-scan:
    # Runs on every PR and push, same as build-test — fast, and has no
    # flaky external dependency of its own (the IOC scan is pure local
    # pattern-matching; ClamAV's signature update is allowed to fail soft
    # without blocking, see below).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure origin/main is available for the protected-files diff check
        run: git fetch origin main:refs/remotes/origin/main || true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: IOC and heuristic scan (security/malware_iocs.json + generic checks)
        id: ioc_scan
        continue-on-error: true
        run: python3 scripts/malware_scan.py

      - name: Install ClamAV
        run: sudo apt-get update -qq && sudo apt-get install -y clamav clamav-freshclam

      - name: Update ClamAV signatures
        # Best-effort: ClamAV's mirror infrastructure is a known source of
        # CI flakiness unrelated to anything in this PR. A stale/missing DB
        # is handled explicitly below, not by silently skipping the scan.
        continue-on-error: true
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet

      - name: ClamAV scan (broader, signature-based detection)
        run: |
          set +e
          clamscan -r --infected \
            --exclude-dir='(^|/)\.git($|/)' \
            --exclude-dir='(^|/)target($|/)' \
            --exclude-dir='(^|/)vendor($|/)' \
            .
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::error::ClamAV found infected file(s) — see output above."
            exit 1
          elif [ "$code" -eq 2 ]; then
            echo "::warning::ClamAV scan errored (e.g. signature DB unavailable) rather than finding malware — not blocking on this alone, but investigate."
          fi
          exit 0

      - name: Fail the job if the IOC/heuristic scan found something
        if: steps.ioc_scan.outcome == 'failure'
        run: |
          echo "::error::IOC/heuristic malware scan failed — see the scan step above for details."
          exit 1

  # A single stable status check for branch protection to require.
  #
  # build-test is a matrix, so its own check names are the expanded ones
  # ("PHP 8.1 / ubuntu-latest", ...). Requiring those directly means editing
  # branch protection every time the matrix changes, and a required context
  # that no longer exists blocks every merge silently. This job's name does
  # not move, so `ci` is the only context protection needs.
  #
  # if: always() so this runs even when a needed job fails — otherwise a
  # failure would leave the check pending rather than red, which protection
  # treats as "not yet", not as "no".
  ci:
    name: ci
    needs: [build-test, malware-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        run: |
          echo "build-test:   ${{ needs.build-test.result }}"
          echo "malware-scan: ${{ needs.malware-scan.result }}"
          if [ "${{ needs.build-test.result }}" != "success" ] \
            || [ "${{ needs.malware-scan.result }}" != "success" ]; then
            echo "::error::a required job did not succeed"
            exit 1
          fi
